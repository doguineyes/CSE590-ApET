[project]
name = "cse590-apet-original"
version = "0.1.0"
description = "Candidate Linux inference environment for original ApET LLaVA"
requires-python = "==3.10.18"
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.37.2",
    "accelerate==0.21.0",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "huggingface-hub==0.33.4",
    "safetensors==0.5.3",
    "sentencepiece==0.1.99",
    "protobuf==3.20.3",
    "einops==0.6.1",
    "matplotlib==3.10.3",
    "shortuuid==1.0.13",
    "requests==2.32.4",
]

[tool.uv]
package = false
required-version = "==0.9.5"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
